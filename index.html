<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание занятий</title>
<style>
  :root {
    --bg: #f4f6fa;
    --card: #ffffff;
    --ink: #18233f;
    --muted: #66708a;
    --line: #dde2ee;
    --accent: #2457d6;
    --accent-soft: #e6edfc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0f1526;
      --card: #172038;
      --ink: #e8ecf7;
      --muted: #9aa5c4;
      --line: #28345a;
      --accent: #6e96ff;
      --accent-soft: #1e2c55;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.5;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 48px 20px 64px; }
  h1 { font-size: clamp(1.8rem, 5vw, 2.6rem); margin: 0 0 8px; letter-spacing: -0.02em; }
  .sub { color: var(--muted); margin: 0 0 32px; }

  .picker { display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 32px; }
  .picker button {
    font: inherit;
    padding: 10px 16px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .picker button:hover { border-color: var(--accent); }
  .picker button[aria-pressed="true"] {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

  .empty { color: var(--muted); padding: 28px; border: 2px dashed var(--line); border-radius: 14px; text-align: center; }

  .table-box { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow-x: auto; }
  .table-box h2 { margin: 0; padding: 18px 20px; font-size: 1.15rem; border-bottom: 1px solid var(--line); }
  table { width: 100%; border-collapse: collapse; min-width: 520px; }
  th, td { text-align: left; padding: 14px 20px; }
  th { background: var(--accent-soft); color: var(--accent); font-weight: 600; font-size: .95rem; }
  td { border-top: 1px solid var(--line); }
  td:first-child, th:first-child { width: 70px; text-align: center; color: var(--muted); }
  th:first-child { color: var(--accent); }
  td:nth-child(4) { white-space: nowrap; font-variant-numeric: tabular-nums; }
  tbody tr:hover { background: var(--accent-soft); }
</style>
</head>
<body>
<main class="wrap">
  <h1>Расписание занятий</h1>
  <p class="sub">Выберите специальность, и ниже появится расписание.</p>

  <div class="picker" id="picker" role="group" aria-label="Специальности"></div>

  <div id="output" aria-live="polite">
    <div class="empty">Специальность пока не выбрана.</div>
  </div>
</main>

    { name: "Архитектура", lessons: [

    { name: "Психология", lessons: [

      ["Социальная психология", "Журсинов Е.Д.", "11:30 – 12:50"],
      ["Психология личности", "Каримова Н.С.", "12:50 – 14:10"],
      ["Психодиагностика", "Абдулина А.Т.", "14:40 – 16:00"],
      ["Консультирование", "Бейсенов М.К.", "16:00 – 17:20"],
      ["Статистика в психологии", "Лукьянова В.Н.", "17:50 – 19:10"],
      ["Практикум по тренингу", "Калиева Ж.О.", "19:10 – 20:30"] ]},
    { name: "Менеджмент", lessons: [
      ["Основы менеджмента", "Ермекбаев А.Н.", "08:00 – 09:20"],
      ["Управление проектами", "Сарсенова Д.К.", "09:50 – 11:10"],
      ["Организационное поведение", "Кузнецов П.А.", "11:20 – 12:40"],
      ["Управление персоналом", "Бисенова Г.Т.", "13:00 – 14:20"],
      ["Стратегический менеджмент", "Мухамеджанов Б.Е.", "14:50 – 16:10"],
      ["Предпринимательство", "Абилова С.М.", "16:30 – 17:50"],
      ["Бизнес-коммуникации", "Ковалёва А.Д.", "18:00 – 19:20"] ]}
  ];

  // ============ КОД — ТРОГАТЬ НЕ НУЖНО ============

  const picker = document.getElementById("picker");
  const output = document.getElementById("output");

  function showTable(index) {
    const spec = SPECIALTIES[index];
    const rows = spec.lessons.map((lesson, i) =>
      `<tr>
        <td>${i + 1}</td>
        <td>${lesson[0]}</td>
        <td>${lesson[1]}</td>
        <td>${lesson[2]}</td>
      </tr>`).join("");

    output.innerHTML = `
      <div class="table-box">
        <h2>${spec.name}</h2>
        <table>
          <thead>
            <tr>
              <th>№ пары</th>
              <th>Предмет</th>
              <th>Преподаватель</th>
              <th>Время</th>
            </tr>
          </thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;

    picker.querySelectorAll("button").forEach((b, i) =>
      b.setAttribute("aria-pressed", i === index ? "true" : "false"));
  }

  SPECIALTIES.forEach((spec, i) => {
    const btn = document.createElement("button");
    btn.type = "button";
    btn.textContent = spec.name;
    btn.setAttribute("aria-pressed", "false");
    btn.addEventListener("click", () => showTable(i));
    picker.appendChild(btn);
  });
</script>
</body>
</html>
